[workspace]
resolver = "3"
members = ["crates/hf-net"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["HarnessForge contributors"]
publish = false

[workspace.dependencies]
hf-net = { path = "crates/hf-net" }
hf-engine = { path = "crates/hf-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
url = { version = "2", features = ["serde"] }
futures-util = "0.3"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.clippy]
# Garde-fou réseau : ces types et fonctions sont interdits hors de hf-net (voir clippy.toml).
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
